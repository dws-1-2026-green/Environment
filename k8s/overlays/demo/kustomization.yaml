apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - secrets.yaml

patches:
  # ── Storage class ────────────────────────────────────────────────────────────
  # VK Cloud PA2 zone. Change value for a different cloud/zone:
  #   GZ1: csi-ceph-hdd-gz1
  #   AWS: gp3 / gp2
  #   GCP: standard-rwo
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/storageConfig/cassandraDataVolumeClaimSpec/storageClassName
        value: csi-ceph-hdd-pa2
    target:
      kind: K8ssandraCluster
      name: cassandra
  # Kafka теперь управляется Strimzi → storage class задаётся на KafkaNodePool
  - patch: |
      - op: add
        path: /spec/storage/volumes/0/class
        value: csi-ceph-hdd-pa2
    target:
      kind: KafkaNodePool
      name: dual-role
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd-pa2
    target:
      kind: StatefulSet
      name: grafana
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd-pa2
    target:
      kind: StatefulSet
      name: loki
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd-pa2
    target:
      kind: StatefulSet
      name: prometheus

  # ── Node affinity ────────────────────────────────────────────────────────────
  # Pin stateful data services to a dedicated node group (VK Cloud label).
  # Remove these patches if the cluster has no dedicated data node group.
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/racks
        value:
          - name: r1
            nodeAffinityLabels:
              mcs.mail.ru/mcs-nodepool: data
    target:
      kind: K8ssandraCluster
      name: cassandra
  - patch: |
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: dual-role
        namespace: webhooks
      spec:
        template:
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: mcs.mail.ru/mcs-nodepool
                          operator: In
                          values:
                            - data

  # Memory limits for cassandra are now defined in base K8ssandraCluster
  # (spec.cassandra.datacenters[0].resources.limits cpu:1/memory:2Gi).

secretGenerator:
  - name: grafana-credentials
    namespace: webhooks
    literals:
      - admin-user=admin
      - admin-password=tVbfSvowVeJXPqW3mvYf
    behavior: replace
    options:
      disableNameSuffixHash: true
