apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - secrets.yaml

patches:
  # ── Storage class ────────────────────────────────────────────────────────────
  # green-2 (зона MS1): топология-aware класс csi-ceph-hdd (WaitForFirstConsumer)
  # — том создаётся в зоне пода, работает в любой зоне. Для жёсткой привязки к зоне
  # можно использовать csi-ceph-hdd-ms1 / csi-ceph-hdd-pa2 / csi-ceph-hdd-gz1.
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/storageConfig/cassandraDataVolumeClaimSpec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: K8ssandraCluster
      name: cassandra
  # Kafka теперь управляется Strimzi → storage class задаётся на KafkaNodePool
  - patch: |
      - op: add
        path: /spec/storage/volumes/0/class
        value: csi-ceph-hdd
    target:
      kind: KafkaNodePool
      name: dual-role
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: grafana
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: loki
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: prometheus

  # ── Node placement (по меткам узлов, не по нодпулам) ─────────────────────────
  # Данные (Cassandra, Kafka) → узлы с меткой webhooks-data=true
  # Приложение и observability (Deployments + StatefulSets) → webhooks-worker=true
  # Метки навешиваются на узлы вручную/нодпулом; здесь привязка идёт только к меткам.

  # Cassandra → webhooks-data
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/racks
        value:
          - name: r1
            nodeAffinityLabels:
              webhooks-data: "true"
    target:
      kind: K8ssandraCluster
      name: cassandra
  # Kafka → webhooks-data
  - patch: |
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: dual-role
        namespace: webhooks
      spec:
        template:
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: webhooks-data
                          operator: In
                          values:
                            - "true"

  # Все приложения (Deployments: apps + kafka-ui) → webhooks-worker
  - patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          webhooks-worker: "true"
    target:
      kind: Deployment
  # Observability (StatefulSets: prometheus, grafana, loki) → webhooks-worker
  - patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          webhooks-worker: "true"
    target:
      kind: StatefulSet

  # Memory limits for cassandra are now defined in base K8ssandraCluster
  # (spec.cassandra.datacenters[0].resources.limits cpu:1/memory:2Gi).

secretGenerator:
  - name: grafana-credentials
    namespace: webhooks
    literals:
      - admin-user=admin
      - admin-password=tVbfSvowVeJXPqW3mvYf
    behavior: replace
    options:
      disableNameSuffixHash: true
