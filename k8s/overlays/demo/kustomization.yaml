apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - secrets.yaml

patches:
  # Storage class: топология-aware csi-ceph-hdd (WaitForFirstConsumer).
  # Для жёсткой привязки к зоне: csi-ceph-hdd-ms1 / -pa2 / -gz1.
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/storageConfig/cassandraDataVolumeClaimSpec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: K8ssandraCluster
      name: cassandra
  - patch: |
      - op: add
        path: /spec/storage/volumes/0/class
        value: csi-ceph-hdd
    target:
      kind: KafkaNodePool
      name: dual-role
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: grafana
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: loki
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: prometheus
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: csi-ceph-hdd
    target:
      kind: StatefulSet
      name: delivery-postgres

  # Node placement по меткам узлов:
  #   данные (Cassandra, Kafka) → webhooks-data=true
  #   приложения и observability → webhooks-worker=true
  # Cassandra → webhooks-data
  - patch: |
      - op: add
        path: /spec/cassandra/datacenters/0/racks
        value:
          - name: r1
            nodeAffinityLabels:
              webhooks-data: "true"
    target:
      kind: K8ssandraCluster
      name: cassandra
  # Kafka → webhooks-data
  - patch: |
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: dual-role
        namespace: webhooks
      spec:
        template:
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: webhooks-data
                          operator: In
                          values:
                            - "true"

  # Приложения (Deployments) → webhooks-worker
  - patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          webhooks-worker: "true"
    target:
      kind: Deployment
  # Observability (StatefulSets) → webhooks-worker
  - patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          webhooks-worker: "true"
    target:
      kind: StatefulSet

secretGenerator:
  - name: grafana-credentials
    namespace: webhooks
    literals:
      - admin-user=admin
      - admin-password=tVbfSvowVeJXPqW3mvYf
    behavior: replace
    options:
      disableNameSuffixHash: true
