# ─── Basic Auth Secret ────────────────────────────────────────────────────────
# Сгенерируй htpasswd и вставь сюда:
#   htpasswd -nb admin ТВОЙ_ПАРОЛЬ
# Или через Docker:
#   docker run --rm httpd:alpine htpasswd -nb admin ТВОЙ_ПАРОЛЬ
#
# Результат будет выглядеть так: admin:$apr1$xyz...
# Вставь его в поле auth ниже (в base64):
#   echo -n 'admin:$apr1$xyz...' | base64
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: webhooks
type: Opaque
data:
  # echo -n 'admin:$apr1$REPLACE_WITH_HTPASSWD_HASH' | base64
  auth: YWRtaW46JGFwcjEkZ2tlanBOMnkkRzlBcG9ibk9PU2dxb2JYdlRhWVBqLw==
---
# ─── Ingress ──────────────────────────────────────────────────────────────────
# Требует установленного nginx ingress controller:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhooks-staging
  namespace: webhooks
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Webhooks Staging — Authorization Required"
spec:
  ingressClassName: nginx
  rules:
    # Замени на реальный домен или IP стенда
    - host: staging.dws.sidey383.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-receiver
                port:
                  number: 8080

    - host: subscriptions.staging.dws.sidey383.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: subscriptions-api
                port:
                  number: 8082

    - host: kafka-ui.staging.dws.sidey383.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080

    - host: prometheus.staging.dws.sidey383.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090

    - host: grafana.staging.dws.sidey383.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000