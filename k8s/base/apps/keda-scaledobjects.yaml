apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: subscriptions-worker
  namespace: webhooks
spec:
  scaleTargetRef:
    name: subscriptions-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka.webhooks.svc.cluster.local:9094
        consumerGroup: subscriptions-worker
        topic: routing.requests
        lagThreshold: "100"
        offsetResetPolicy: latest
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: delivery-service
  namespace: webhooks
spec:
  scaleTargetRef:
    name: delivery-service
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka.webhooks.svc.cluster.local:9094
        consumerGroup: delivery-group
        topic: deliveries.to_send
        lagThreshold: "50"
        offsetResetPolicy: latest
