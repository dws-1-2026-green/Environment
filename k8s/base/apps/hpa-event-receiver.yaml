apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-receiver
  namespace: webhooks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-receiver
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
