apiVersion: v1
kind: Service
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  selector:
    app: subscriptions-api
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriptions-api
  template:
    metadata:
      labels:
        app: subscriptions-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-cassandra
          image: cassandra:4.1
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra-dc1-service.webhooks.svc.cluster.local -e "describe keyspaces"; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
      containers:
        - name: subscriptions-api
          image: ghcr.io/dws-1-2026-green/subscriptions-api:main
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: BUILD_TARGET
              value: "api"
            - name: STORE_BACKEND
              value: "cassandra"
            - name: CASSANDRA_HOSTS
              value: "cassandra-dc1-service.webhooks.svc.cluster.local"
            - name: CASSANDRA_CONSISTENCY
              value: "LOCAL_ONE"
            - name: HTTP_ADDR
              value: ":8082"
