apiVersion: v1
kind: Service
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  selector:
    app: subscriptions-api
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriptions-api
  template:
    metadata:
      labels:
        app: subscriptions-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-cassandra
          image: cassandra:4.1
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra-0.cassandra.webhooks.svc.cluster.local -e "describe keyspaces"; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
      containers:
        - name: subscriptions-api
          image: ghcr.io/dws-1-2026-green/subscriptions-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: subscriptions-config
          env:
            - name: BUILD_TARGET
              value: "api"
            - name: HTTP_ADDR
              value: ":8082"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: subscriptions-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
