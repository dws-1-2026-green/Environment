apiVersion: v1
kind: Service
metadata:
  name: subscriptions-worker
  namespace: webhooks
spec:
  selector:
    app: subscriptions-worker
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions-worker
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriptions-worker
  template:
    metadata:
      labels:
        app: subscriptions-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-cassandra
          image: cassandra:4.1
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra-0.cassandra.webhooks.svc.cluster.local -e "describe keyspaces"; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
      containers:
        - name: subscriptions-worker
          image: ghcr.io/dws-1-2026-green/subscriptions-worker:main
          ports:
            - containerPort: 9091
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: subscriptions-config
          env:
            - name: BUILD_TARGET
              value: "worker"
            - name: METRICS_ADDR
              value: ":9091"
