apiVersion: v1
kind: Service
metadata:
  name: event-receiver
  namespace: webhooks
spec:
  selector:
    app: event-receiver
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-receiver
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-receiver
  template:
    metadata:
      labels:
        app: event-receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: event-receiver
          image: ghcr.io/dws-1-2026-green/eventreceiver:master
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: "kafka-0.kafka.webhooks.svc.cluster.local:9094"
