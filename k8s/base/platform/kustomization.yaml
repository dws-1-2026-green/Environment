apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Платформенные операторы/аддоны для всех окружений.
#   cluster-infra/ — cert-manager, KEDA, metrics-server (свои namespace)
#   k8ssandra/     — k8ssandra + cass-operator + strimzi (namespace: webhooks)
# Применять отдельным шагом перед overlay (после ingress-nginx):
#   kubectl apply -k k8s/base/platform --server-side
resources:
  - cluster-infra
  - k8ssandra
