apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ──────────────────────────────────────────────────────────────────────────────
# Платформенный слой: операторы/аддоны, нужные всем окружениям для автоскейлинга
# и управляемой Kafka.
#
# ВАЖНО: здесь НЕ задаётся `namespace:` — эти компоненты ставятся в собственные
# namespace (metrics-server → kube-system, KEDA → keda). Поэтому слой держим
# ОТДЕЛЬНЫМ и НЕ подключаем в namespaced base/kustomization.yaml (иначе его
# namespace-трансформер сломает ресурсы).
#
# Применять отдельным шагом перед overlay (как k8s/ingress-nginx):
#   kubectl apply -k k8s/base/platform --server-side
#
# В управляемых кластерах metrics-server часто уже установлен — тогда уберите
# его ресурс отсюда.
# ──────────────────────────────────────────────────────────────────────────────
resources:
  # metrics-server — отдаёт metrics.k8s.io для HPA по CPU (HTTP-сервисы)
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
  # KEDA — external-metrics adapter; CRD keda.sh/v1alpha1 (kafka-триггер по лагу)
  - https://github.com/kedacore/keda/releases/download/v2.19.0/keda-2.19.0.yaml
  # Strimzi cluster operator (watch namespace = webhooks)
  - ../../strimzi-operator
  # cert-manager — зависимость k8ssandra-operator (TLS-webhooks, сертификаты cass-operator)
  # Порядок применения: cert-manager → (поды Ready) → k8ssandra-operator
  - https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
  # k8ssandra-operator — управляет K8ssandraCluster CRD; control-plane режим (cluster-scoped)
  # По умолчанию следит за всеми namespace, K8ssandraCluster в webhooks виден оператору.
  - github.com/k8ssandra/k8ssandra-operator/config/deployments/control-plane?ref=v1.32.1
