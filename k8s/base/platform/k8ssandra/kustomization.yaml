apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Операторы Kafka и Cassandra в namespace webhooks. WATCH_NAMESPACE берётся из
# metadata.namespace (fieldRef), поэтому они следят за webhooks без доп. патчей.
namespace: webhooks

resources:
  # Strimzi Cluster Operator (watch-namespace = webhooks)
  - https://strimzi.io/install/latest?namespace=webhooks
  # k8ssandra-operator + cass-operator (control-plane mode, cluster-scoped CRDs)
  - github.com/k8ssandra/k8ssandra-operator/config/deployments/control-plane?ref=v1.32.1

# Патчи: kustomize переносит namespace в namespaced-ресурсах, но не трогает
# строковые значения внутри spec/annotations кластерных ресурсов — правим вручную.
patches:
  # dnsNames в Certificate (оригинал: *.k8ssandra-operator.svc)
  - patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: cass-operator-webhook-service.webhooks.svc
      - op: replace
        path: /spec/dnsNames/1
        value: cass-operator-webhook-service.webhooks.svc.cluster.local
    target:
      kind: Certificate
      name: cass-operator-serving-cert

  # inject-ca-from annotation в webhook-конфигурациях cass-operator (namespace CA-секрета)
  - patch: |
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: webhooks/cass-operator-serving-cert
    target:
      kind: MutatingWebhookConfiguration
      name: cass-operator-mutating-webhook-configuration
  - patch: |
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: webhooks/cass-operator-serving-cert
    target:
      kind: ValidatingWebhookConfiguration
      name: cass-operator-validating-webhook-configuration
