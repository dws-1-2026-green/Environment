apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: webhooks
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: "delivery-postgres-0.delivery-postgres.webhooks.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: delivery-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-postgres-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: delivery-postgres-credentials
                  key: database
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
