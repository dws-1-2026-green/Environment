apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: webhooks
spec:
  clusterIP: None
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: webhooks
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - containerPort: 9042
          env:
            # - name: CASSANDRA_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: cassandra-credentials
            #       key: username
            # - name: CASSANDRA_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: cassandra-credentials
            #       key: password
            - name: CASSANDRA_CLUSTER_NAME
              value: "WebhooksCluster"
            - name: CASSANDRA_DC
              value: "dc1"
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: "GossipingPropertyFileSnitch"
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
          readinessProbe:
            exec:
              command: ["cqlsh", "-e", "describe keyspaces"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["cqlsh", "-e", "describe keyspaces"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-schema
  namespace: webhooks
data:
  init.up.cql: |
    -- Keyspace for webhook subscriptions
    CREATE KEYSPACE IF NOT EXISTS webhooks
    WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': 1}
    AND durable_writes = true;

    -- Table for subscriptions
    -- Partition key: (source, event_type) - optimized for lookup by source and event type
    -- Clustering key: subscription_id - allows multiple subscriptions per (source, event_type)
    CREATE TABLE IF NOT EXISTS webhooks.subscriptions (
        source text,
        event_type text,
        subscription_id uuid,
        destination_url text,
        http_method text,
        headers frozen<map<text, text>>,
        enabled boolean,
        created_at timestamp,
        PRIMARY KEY ((source, event_type), subscription_id)
    ) WITH CLUSTERING ORDER BY (subscription_id ASC)
      AND default_time_to_live = 0
      AND gc_grace_seconds = 86400;

    -- Table for subscriptions by ID (for CRUD operations)
    CREATE TABLE IF NOT EXISTS webhooks.subscriptions_by_id (
      subscription_id uuid PRIMARY KEY,
      source text,
      event_type text,
      destination_url text,
      http_method text,
      headers frozen<map<text, text>>,
      enabled boolean,
      created_at timestamp
    );

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-up
  namespace: webhooks
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cassandra
          image: cassandra:4.1
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra-0.cassandra.webhooks.svc.cluster.local -e "describe keyspaces"; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
      containers:
        - name: schema-init
          image: cassandra:4.1
          command:
            - cqlsh
            - cassandra-0.cassandra.webhooks.svc.cluster.local
            - -f
            - /schema.cql
          volumeMounts:
            - name: schema
              mountPath: /schema.cql
              subPath: init.up.cql
      volumes:
        - name: schema
          configMap:
            name: cassandra-schema