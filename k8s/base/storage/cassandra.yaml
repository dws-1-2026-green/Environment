apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cassandra
  namespace: webhooks
spec:
  auth: false
  cassandra:
    # serverVersion must match a version supported by k8ssandra-operator v1.32.1
    # (typically 4.1.x; verify in operator release notes before applying)
    serverVersion: "4.1.7"
    datacenters:
      - metadata:
          name: dc1
        size: 3
        storageConfig:
          cassandraDataVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            # storageClassName: set via overlay JSON6902 patch
        config:
          jvmOptions:
            heapSize: "512M"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
  reaper:
    autoScheduling:
      enabled: true
---
# CQL service: cassandra-dc1-service.webhooks.svc.cluster.local:9042
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-schema
  namespace: webhooks
data:
  init.up.cql: |
    -- Keyspace for webhook subscriptions
    CREATE KEYSPACE IF NOT EXISTS webhooks
    WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': 3}
    AND durable_writes = true;

    -- Table for subscriptions
    -- Partition key: (source, event_type) - optimized for lookup by source and event type
    -- Clustering key: subscription_id - allows multiple subscriptions per (source, event_type)
    CREATE TABLE IF NOT EXISTS webhooks.subscriptions (
        source text,
        event_type text,
        subscription_id uuid,
        destination_url text,
        http_method text,
        headers frozen<map<text, text>>,
        enabled boolean,
        created_at timestamp,
        PRIMARY KEY ((source, event_type), subscription_id)
    ) WITH CLUSTERING ORDER BY (subscription_id ASC)
      AND default_time_to_live = 0
      AND gc_grace_seconds = 86400;

    -- Table for subscriptions by ID (for CRUD operations)
    CREATE TABLE IF NOT EXISTS webhooks.subscriptions_by_id (
      subscription_id uuid PRIMARY KEY,
      source text,
      event_type text,
      destination_url text,
      http_method text,
      headers frozen<map<text, text>>,
      enabled boolean,
      created_at timestamp
    );

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-up
  namespace: webhooks
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cassandra
          image: cassandra:4.1
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra-dc1-service.webhooks.svc.cluster.local -e "describe keyspaces"; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
      containers:
        - name: schema-init
          image: cassandra:4.1
          command:
            - cqlsh
            - cassandra-dc1-service.webhooks.svc.cluster.local
            - -f
            - /schema.cql
          volumeMounts:
            - name: schema
              mountPath: /schema.cql
              subPath: init.up.cql
      volumes:
        - name: schema
          configMap:
            name: cassandra-schema
