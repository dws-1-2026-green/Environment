apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webhooks

# Автоскейлинг приложений. Подключается ТОЛЬКО в облачные overlay (demo/staging),
# где установлены metrics-server и KEDA. В local (minikube) не используется,
# чтобы apply не падал из-за отсутствия CRD KEDA.
resources:
  - http-hpa.yaml              # event-receiver, subscriptions-api  (HPA по CPU)
  - kafka-scaledobjects.yaml   # delivery-service, subscriptions-worker (KEDA по лагу)
