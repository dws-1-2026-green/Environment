# ──────────────────────────────────────────────────────────────────────────────
# HTTP-сервисы: масштабирование по CPU через стандартный HorizontalPodAutoscaler.
# Требует установленного metrics-server в кластере.
# Работает за счёт resources.requests.cpu, заданных в Deployment'ах.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-receiver
  namespace: webhooks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-receiver
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300   # медленный scale-down, чтобы не «дёргать» поды
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: subscriptions-api
  namespace: webhooks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: subscriptions-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
