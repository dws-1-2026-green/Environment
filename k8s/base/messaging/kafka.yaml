# Kafka под управлением Strimzi (KRaft + KafkaNodePool).
# Bootstrap: kafka-kafka-bootstrap.webhooks.svc.cluster.local:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        # storageClassName ("class") задаётся в overlay (demo/staging)
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "500m"
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: webhooks
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Kafka Exporter — метрики consumer lag для Prometheus (скрейп по аннотациям)
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9404"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: routing-requests
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: routing.requests
  partitions: 12
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: deliveries-to-send
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: deliveries.to_send
  partitions: 12
  replicas: 1
