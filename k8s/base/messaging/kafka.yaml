# ──────────────────────────────────────────────────────────────────────────────
# Kafka под управлением оператора Strimzi (KRaft + KafkaNodePool).
# Требует установленного оператора Strimzi (см. k8s/strimzi-operator).
#
# In-cluster bootstrap-адрес: kafka-kafka-bootstrap.webhooks.svc.cluster.local:9092
#
# ⚠️ Это НОВЫЙ кластер под управлением Strimzi — данные старого StatefulSet
#    (PVC kafka-data-kafka-0) не переиспользуются.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        # storageClassName ("class") задаётся в overlay (demo/staging)
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "500m"
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: webhooks
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    # metadataVersion не указываем — оператор подставит дефолт для версии Kafka
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Kafka Exporter публикует kafka_consumergroup_lag и пр. в Prometheus.
  # Аннотации на под, чтобы существующий Prometheus (скрейпит поды webhooks
  # по prometheus.io/scrape) собрал метрики автоматически.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9404"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: routing-requests
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: routing.requests
  partitions: 12
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: deliveries-to-send
  namespace: webhooks
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: deliveries.to_send
  partitions: 12
  replicas: 1
