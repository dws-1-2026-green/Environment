apiVersion: v1
kind: Service
metadata:
  name: delivery-dashboard
  namespace: webhooks
spec:
  selector:
    app: delivery-dashboard
  ports:
    - port: 9096
      targetPort: 9096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-dashboard
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-dashboard
  template:
    metadata:
      labels:
        app: delivery-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h delivery-postgres-0.delivery-postgres.webhooks.svc.cluster.local -U ds -d delivery; do
                echo "Waiting for PostgreSQL..."; sleep 5;
              done
      containers:
        - name: delivery-dashboard
          image: ghcr.io/dws-1-2026-green/delivery-dashboard:main
          imagePullPolicy: Always
          ports:
            - containerPort: 9096
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delivery-postgres-credentials
                  key: url
            - name: ADDR
              value: ":9096"
