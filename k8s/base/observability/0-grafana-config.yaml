---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overview
  namespace: webhooks
data:
  overview.json: |
    {
      "title": "Overview",
      "uid": "overview",
      "version": 2,
      "schemaVersion": 38,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pipeline: Message Flow (per interval)",
          "description": "Сквозной поток сообщений через все сервисы. Разрыв между линиями указывает на бутылочное горлышко.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 12 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "lineWidth": 2 } }
          },
          "targets": [
            {
              "expr": "sum(increase(event_receiver_events_received_total[$__rate_interval]))",
              "legendFormat": "1. Received (event-receiver)",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(event_receiver_events_published_total{status='success'}[$__rate_interval]))",
              "legendFormat": "2. Published to Kafka",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(subscriptions_events_processed_total[$__rate_interval]))",
              "legendFormat": "3. Processed (subscriptions)",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(subscriptions_deliveries_dispatched_total[$__rate_interval]))",
              "legendFormat": "4. Dispatched to delivery",
              "datasource": "Prometheus"
            },
            {
              "expr": "increase(delivery_messages_received_total[$__rate_interval])",
              "legendFormat": "5. Received (delivery-service)",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(delivery_final_status_total{status='success'}[$__rate_interval]))",
              "legendFormat": "6. Successfully delivered",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 2,
          "title": "Current Throughput per Stage",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 1 }
        },
        {
          "id": 3,
          "title": "1. Received",
          "type": "stat",
          "gridPos": { "x": 0, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "blue", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(increase(event_receiver_events_received_total[$__rate_interval]))",
              "legendFormat": "received",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 4,
          "title": "2. Published to Kafka",
          "type": "stat",
          "gridPos": { "x": 4, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "blue", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(increase(event_receiver_events_published_total{status='success'}[$__rate_interval]))",
              "legendFormat": "published",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 5,
          "title": "3. Processed (subscriptions)",
          "type": "stat",
          "gridPos": { "x": 8, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "blue", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(increase(subscriptions_events_processed_total[$__rate_interval]))",
              "legendFormat": "processed",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 6,
          "title": "4. Dispatched to delivery",
          "type": "stat",
          "gridPos": { "x": 12, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "blue", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(increase(subscriptions_deliveries_dispatched_total[$__rate_interval]))",
              "legendFormat": "dispatched",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 7,
          "title": "5. Received (delivery-service)",
          "type": "stat",
          "gridPos": { "x": 16, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "blue", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "increase(delivery_messages_received_total[$__rate_interval])",
              "legendFormat": "received",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 8,
          "title": "6. Successfully Delivered",
          "type": "stat",
          "gridPos": { "x": 20, "y": 13, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(increase(delivery_final_status_total{status='success'}[$__rate_interval]))",
              "legendFormat": "delivered",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 9,
          "title": "Errors",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 17, "w": 24, "h": 1 }
        },
        {
          "id": 10,
          "title": "Kafka Publish Errors (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } }
          },
          "targets": [
            {
              "expr": "sum(increase(event_receiver_events_published_total{status='error'}[$__rate_interval]))",
              "legendFormat": "publish errors",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 11,
          "title": "Routing Errors (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 18, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } }
          },
          "targets": [
            {
              "expr": "increase(subscriptions_routing_errors_total[$__rate_interval])",
              "legendFormat": "routing errors",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 12,
          "title": "Delivery Failures (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 18, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } }
          },
          "targets": [
            {
              "expr": "sum(increase(delivery_final_status_total{status!='success'}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "datasource": "Prometheus"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
