---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: webhooks
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-0.prometheus.webhooks.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.webhooks.svc.cluster.local:3100
        editable: false
---