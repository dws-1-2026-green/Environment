apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: webhooks
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-delivery-service
  namespace: webhooks
data:
  delivery-service.json: |
    {
      "title": "Delivery Service",
      "uid": "delivery-service",
      "version": 1,
      "schemaVersion": 38,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Messages Received (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "increase(delivery_messages_received_total[$__rate_interval])",
              "legendFormat": "received",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 2,
          "title": "Attempt Outcomes (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "sum(increase(delivery_attempts_total[$__rate_interval])) by (status)",
              "legendFormat": "{{status}}",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 3,
          "title": "Final Status (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "sum(increase(delivery_final_status_total[$__rate_interval])) by (status)",
              "legendFormat": "{{status}}",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 4,
          "title": "Attempt Duration (p99, ms)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 7, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(delivery_attempt_duration_seconds_bucket[1m])) by (le)) * 1000",
              "legendFormat": "p99",
              "datasource": "Prometheus"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(delivery_attempt_duration_seconds_bucket[1m])) by (le)) * 1000",
              "legendFormat": "p50",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 5,
          "title": "Retries (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 7, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "increase(delivery_retries_total[$__rate_interval])",
              "legendFormat": "retries",
              "datasource": "Prometheus"
            }
          ]
        },
        {
          "id": 6,
          "title": "Pipeline: End-to-End Event Flow (per interval)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 7, "w": 8, "h": 7 },
          "targets": [
            {
              "expr": "sum(increase(event_receiver_events_received_total[$__rate_interval]))",
              "legendFormat": "received",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(subscriptions_events_processed_total[$__rate_interval]))",
              "legendFormat": "routed",
              "datasource": "Prometheus"
            },
            {
              "expr": "sum(increase(delivery_final_status_total{status='success'}[$__rate_interval]))",
              "legendFormat": "delivered",
              "datasource": "Prometheus"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-event-receiver
  namespace: webhooks
