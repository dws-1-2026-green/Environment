apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml

patches:
  # Открыть порты 80/443 на LB для всех IP (VK Cloud/OpenStack создаёт security group
  # по loadBalancerSourceRanges; без этого поля внешний трафик блокируется).
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        loadBalancerSourceRanges:
          - 0.0.0.0/0

  # Run ingress-nginx on all nodes (one pod per node via anti-affinity)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx
                        app.kubernetes.io/component: controller
                    topologyKey: kubernetes.io/hostname
