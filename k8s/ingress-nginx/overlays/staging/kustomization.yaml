apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Bare-metal: нет облачного балансировщика, пробрасываем IP ноды напрямую.
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        externalIPs:
          - 194.147.90.58

  # Single-node: одна реплика, anti-affinity не нужен.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        replicas: 1
