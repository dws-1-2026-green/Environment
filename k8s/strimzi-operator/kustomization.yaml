apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Оператор Strimzi (Cluster Operator), watch-namespace = webhooks.
# Ставит CRD (Kafka, KafkaNodePool, KafkaTopic, ...), RBAC и Deployment оператора.
#
# Применяется ОТДЕЛЬНЫМ шагом до основного overlay (как k8s/ingress-nginx):
#   kubectl apply -k k8s/strimzi-operator --server-side
#
# TODO: для воспроизводимости запинить версию вместо latest, напр.:
#   https://strimzi.io/install/0.51.0?namespace=webhooks
resources:
  - https://strimzi.io/install/latest?namespace=webhooks
