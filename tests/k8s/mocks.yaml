              value: chaos
            - name: MOCK_CLIENT_ERROR_PCT
              value: "10"
            - name: MOCK_ERROR_PCT
              value: "30"
            - name: MOCK_RESET_PCT
              value: "20"
            - name: MOCK_SLOW_PCT
              value: "15"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-chaos
  namespace: webhooks-test
spec:
  selector:
    app: mock-chaos
  ports:
    - port: 8080
      targetPort: 8080
