# Mock webhook receivers for k8s load testing.
#
# Mocks expose ports on the host so delivery-service running inside
# Docker Desktop k8s can reach them via host.docker.internal:<port>.
#
# Ports:
#   mock-reliable  → host:8091
#   mock-flaky     → host:8092
#   mock-chaos     → host:8093
#
# Usage:
#   docker compose -f tests/k8s/docker-compose.mocks.yml up -d --build
#   bash tests/k8s/mock-setup.sh
#   go test -v -run TestLoad_10RPS -timeout 15m ./tests/e2e/

services:

  mock-reliable:
    build:
      context: ../../cmd/mock-receiver
    container_name: mock-reliable
    restart: unless-stopped
    environment:
      MOCK_NAME: reliable
      MOCK_CLIENT_ERROR_PCT: "2"
      MOCK_ERROR_PCT: "3"
      MOCK_RESET_PCT: "2"
      MOCK_SLOW_PCT: "10"
    ports:
      - "8091:8080"

  mock-flaky:
    build:
      context: ../../cmd/mock-receiver
    container_name: mock-flaky
    restart: unless-stopped
    environment:
      MOCK_NAME: flaky
      MOCK_CLIENT_ERROR_PCT: "5"
      MOCK_ERROR_PCT: "15"
      MOCK_RESET_PCT: "10"
      MOCK_SLOW_PCT: "20"
    ports:
      - "8092:8080"

  mock-chaos:
    build:
      context: ../../cmd/mock-receiver
    container_name: mock-chaos
    restart: unless-stopped
    environment:
      MOCK_NAME: chaos
      MOCK_CLIENT_ERROR_PCT: "10"
      MOCK_ERROR_PCT: "30"
      MOCK_RESET_PCT: "20"
      MOCK_SLOW_PCT: "15"
    ports:
      - "8093:8080"
