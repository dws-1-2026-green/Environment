version: "3.8"

services:
  event-receiver:
    image: ghcr.io/dws-1-2026-green/eventreceiver:master
    container_name: event-receiver
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9094
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - kafka-net
      - monitoring-net

  delivery-postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds-password
      POSTGRES_DB: delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - delivery-postgres-net

  delivery-service:
    image: ghcr.io/dws-1-2026-green/delivery-service:main
    container_name: delivery-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9094
      KAFKA_TOPIC: deliveries.to_send
      METRICS_ADDR: ":9095"
      DATABASE_URL: postgres://ds:ds-password@delivery-postgres:5432/delivery
      LOG_LEVEL: debug
    ports:
      - "9095:9095"
    depends_on:
      kafka:
        condition: service_started
      delivery-postgres:
        condition: service_healthy
    networks:
      - kafka-net
      - monitoring-net
      - delivery-postgres-net

  delivery-dashboard:
    image: ghcr.io/dws-1-2026-green/delivery-dashboard:main
    container_name: delivery-dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ds:ds-password@delivery-postgres:5432/delivery
      ADDR: ":9096"
    ports:
      - "9096:9096"
    depends_on:
      delivery-postgres:
        condition: service_healthy
    networks:
      - delivery-postgres-net

  subscriptions-api:
    image: ghcr.io/dws-1-2026-green/subscriptions-api:main
    container_name: subscriptions-api
    restart: unless-stopped

    environment:
      BUILD_TARGET: api
      STORE_BACKEND: cassandra
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_CONSISTENCY: LOCAL_ONE
      HTTP_ADDR: ":8082"
      LOG_LEVEL: debug
    ports:
      - "8082:8082"
    networks:
      - kafka-net
      - cassandra-net
      - monitoring-net
    depends_on:
      cassandra:
        condition: service_healthy

  subscriptions-worker:
    image: ghcr.io/dws-1-2026-green/subscriptions-worker:main
    container_name: subscriptions-worker
    restart: unless-stopped

    environment:
      BUILD_TARGET: worker
      KAFKA_BROKERS: kafka:9094
      STORE_BACKEND: cassandra
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_CONSISTENCY: LOCAL_ONE
      METRICS_ADDR: ":9091"
      LOG_LEVEL: debug
    ports:
      - "9091:9091"
    networks:
      - kafka-net
      - cassandra-net
      - monitoring-net
    depends_on:
      kafka:
        condition: service_started
      cassandra:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # РЎР»СѓС€Р°РµРј РЅР° РґРІСѓС… РїРѕСЂС‚Р°С…:
      # 9092 - РґР»СЏ РїРѕРґРєР»СЋС‡РµРЅРёР№ СЃ С…РѕСЃС‚Р°
      # 9094 - РґР»СЏ РїРѕРґРєР»СЋС‡РµРЅРёР№ РІРЅСѓС‚СЂРё Docker-СЃРµС‚Рё
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Р РµРєР»Р°РјРёСЂСѓРµРј РѕР±Р° Р°РґСЂРµСЃР°:
      # localhost:9092 - РґР»СЏ РїСЂРёР»РѕР¶РµРЅРёР№ РЅР° С…РѕСЃС‚Рµ
      # kafka:9094 - РґР»СЏ СЃРµСЂРІРёСЃРѕРІ РІРЅСѓС‚СЂРё Docker (kafka-ui)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-topics-create:
    image: apache/kafka:latest
    container_name: kafka-topics-create
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic routing.requests --partitions 5 --replication-factor 1 &&
               /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic deliveries.to_send --partitions 10 --replication-factor 1"
    restart: "no"
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    ports:
      - "8081:8080"
    networks:
      - kafka-net

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "WebhooksCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    networks:
      - cassandra-net
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  cassandra-up:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.up.cql:/schema.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"
    networks:
      - cassandra-net

  cassandra-down:
    image: cassandra:4.1
    profiles:
      - down 
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.down.cql:/schema.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"
    networks:
      - cassandra-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9094"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
      - monitoring-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - event-receiver
      - subscriptions-worker
      - delivery-service
      - kafka-exporter
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../k8s/base/dashboards/subscriptions.json:/etc/grafana/provisioning/dashboards/subscriptions.json:ro
      - ../k8s/base/dashboards/overview.json:/etc/grafana/provisioning/dashboards/overview.json:ro
      - ../k8s/base/dashboards/delivery-service.json:/etc/grafana/provisioning/dashboards/delivery-service.json:ro
      - ../k8s/base/dashboards/event-receiver.json:/etc/grafana/provisioning/dashboards/event-receiver.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net

networks:
  kafka-net:
    driver: bridge
  cassandra-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  delivery-postgres-net:
    driver: bridge

volumes:
  kafka-data:
  postgres_data:
  prometheus_data:
  grafana_data:
  cassandra_data:

