# Stress-test overlay — run on top of the main compose:
#
#   docker compose -f docker-compose.yml -f docker-compose_stress_test.yml up -d
#
# What this adds:
#   mock-reliable  — stable endpoint, rare errors
#   mock-flaky     — moderate errors and slow responses
#   mock-chaos     — aggressive errors, resets, slow responses
#   mock-setup     — one-shot: registers subscriptions for source "load-test"
#
# After stack is up, run the load test:
#   go test -v -run TestLoad_10RPS -timeout 15m ./tests/e2e/

services:

  # ── Mock receivers ──────────────────────────────────────────────────────────

  mock-reliable:
    build:
      context: ./cmd/mock-receiver
    container_name: mock-reliable
    restart: unless-stopped
    environment:
      MOCK_NAME: reliable
      MOCK_ERROR_PCT: "3"   # 3%  → 503, retry
      MOCK_RESET_PCT: "2"   # 2%  → conn reset, retry
      MOCK_SLOW_PCT: "10"   # 10% → 200 in 500ms-2s
                             # 85% → 200 in 1-50ms
    networks:
      - mock-net

  mock-flaky:
    build:
      context: ./cmd/mock-receiver
    container_name: mock-flaky
    restart: unless-stopped
    environment:
      MOCK_NAME: flaky
      MOCK_ERROR_PCT: "15"  # 15% → 503, retry
      MOCK_RESET_PCT: "10"  # 10% → conn reset, retry
      MOCK_SLOW_PCT: "20"   # 20% → 200 in 500ms-2s
                             # 55% → 200 in 1-50ms
    networks:
      - mock-net

  mock-chaos:
    build:
      context: ./cmd/mock-receiver
    container_name: mock-chaos
    restart: unless-stopped
    environment:
      MOCK_NAME: chaos
      MOCK_ERROR_PCT: "30"  # 30% → 503, retry
      MOCK_RESET_PCT: "20"  # 20% → conn reset, retry
      MOCK_SLOW_PCT: "15"   # 15% → 200 in 500ms-2s
                             # 35% → 200 in 1-50ms
    networks:
      - mock-net

  # ── Extend existing services with mock-net ──────────────────────────────────

  # delivery-service needs mock-net to reach mock endpoints
  delivery-service:
    networks:
      mock-net: {}

  # subscriptions-api needs mock-net so mock-setup can reach it
  subscriptions-api:
    networks:
      mock-net: {}

  # ── One-shot subscription setup ─────────────────────────────────────────────

  mock-setup:
    image: curlimages/curl:latest
    container_name: mock-setup
    restart: "no"
    entrypoint: ["/bin/sh", "/mock-setup.sh"]
    volumes:
      - ./mock-setup.sh:/mock-setup.sh:ro
    depends_on:
      - subscriptions-api
      - mock-reliable
      - mock-flaky
      - mock-chaos
    networks:
      - mock-net

networks:
  mock-net:
    driver: bridge
